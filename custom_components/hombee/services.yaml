write_register:
  fields:
    installation_id:
      required: true
      selector:
        text:
    key:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        number:
          mode: box
          min: -32768
          max: 65535

write_coil:
  fields:
    installation_id:
      required: true
      selector:
        text:
    key:
      required: true
      selector:
        text:
    state:
      required: true
      selector:
        boolean:

resume_adaptation:
  target:
    entity:
      integration: hombee
      domain: light
  fields:
    brightness:
      default: true
      selector:
        boolean:
    color:
      default: true
      selector:
        boolean:

report_doorbell_ring:
  name: Report doorbell ring
  description: Report a ring for a configured automation doorbell.
  fields:
    doorbellId:
      name: Doorbell ID
      description: Copy the doorbell ID from its setup in Hombee.
      required: true
      selector:
        text:
    eventId:
      name: Event ID
      description: Reuse a stable source event ID when an automation retries.
      selector:
        text:
