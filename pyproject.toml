[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "hombee-hacs"
version = "0.0.0"
description = "Hombee Home Assistant Community Store integrations."
requires-python = ">=3.14.2"
dependencies = [
  "pymodbus>=3.15",
  "voluptuous>=0.16",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.9.4",
  "black>=26.5.1",
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-homeassistant-custom-component>=0.13.363",
  "ruff>=0.16.6",
]

[tool.setuptools]
packages = []

[tool.uv]
prerelease = "disallow"
# Keep our test runners current despite the Home Assistant test plugin's pins.
override-dependencies = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "E",
  "F",
  "FA",
  "I",
  "ICN",
  "N",
  "PERF",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "PLR0913",
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"custom_components/hombee_air/registers.py" = ["E501"]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]
