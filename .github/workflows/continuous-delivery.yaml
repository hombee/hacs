name: Continuous delivery

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: namespace-profile-hombee-linux-x64-tiny;job.priority=1
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "node"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install release dependencies
        run: bun install --frozen-lockfile
      - name: Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
