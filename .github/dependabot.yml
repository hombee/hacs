version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: daily

  - package-ecosystem: uv
    directory: /
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: daily
