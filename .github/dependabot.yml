version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: daily

  - package-ecosystem: uv
    directory: /
    # Assist loads these from Home Assistant's component manifest. Update the
    # pins in pyproject.toml when the tested Home Assistant version changes them.
    ignore:
      - dependency-name: pymicro-vad
      - dependency-name: pyspeex-noise
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    groups:
      dependencies:
        patterns:
          - "*"
    schedule:
      interval: daily
